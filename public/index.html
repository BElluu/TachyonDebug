<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TachyonDebug</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="helperDown" class="helper-down hidden">Lost the connection to the TachyonDebug helper process. Reconnecting…</div>

<header class="topbar">
  <div class="brand">tachyon<span class="thin">-debug</span></div>
  <nav id="nav">
    <button data-view="workbench">Workbench</button>
    <button data-view="scenarios">Scenarios</button>
    <button data-view="settings">Settings</button>
  </nav>
  <div class="spacer"></div>
</header>

<section id="view-workbench" class="view workbench">
  <aside class="sidebar">
    <div class="seg" id="sbTabs">
      <button data-view="collections">Collections</button>
      <button data-view="history">History</button>
    </div>
    <div class="row tight searchrow">
      <input id="sbSearch" class="search" placeholder="Search requests…" spellcheck="false">
      <button id="fromProto" class="icon-btn" title="Refresh from protocol: add the commands that are missing from your collections"></button>
    </div>
    <div id="sbTools" class="row">
      <button id="newReq">+ Request</button>
      <button id="newColl">+ Collection</button>
    </div>
    <div id="sbIo" class="row small-row">
      <button id="impBtn" class="small" title="import requests, collections or scenarios from a .json file (or drop one here)">Import</button>
      <button id="expAll" class="small" title="export every collection to one file">Export all</button>
    </div>
    <div id="tree" class="tree"></div>
    <div id="sbResize" class="col-resizer" title="drag to resize (double-click resets)"></div>
  </aside>

  <div class="main">
    <div class="playerbar">
      <span class="label">Players</span>
      <div id="sessionlist" class="sessionlist"></div>
      <button id="addSession" class="primary">+ Add player</button>
    </div>

    <div id="tabs" class="tabs"></div>

    <div id="emptyState" class="empty-state hidden">
      <h2>No request open</h2>
      <p class="muted">Pick one from a collection on the left, or start a new one.</p>
      <button id="emptyNew" class="primary">+ New request</button>
    </div>

    <div id="builder" class="builder hidden">
      <div class="req-line">
        <select id="bSession" title="send as this player"></select>
        <div class="combo">
          <input id="bCmd" placeholder="Command, e.g. party/invite  ( / )" spellcheck="false" autocomplete="off">
          <div id="bList" class="combo-list hidden"></div>
        </div>
        <button id="bSend" class="primary big" title="Ctrl+Enter">Send</button>
      </div>
      <div id="bInfo" class="info"></div>
      <div class="editor">
        <div class="editor-head">
          <span class="label">Body · JSON</span><span id="bValid" class="valid"></span>
          <span class="spacer"></span>
          <span id="bSchema" class="valid"></span>
          <button id="bFields" class="small" title="fields of this command, from the protocol schema">Fields</button>
          <button id="bFill" class="small" title="insert every field of the schema (keeps values you already typed)">Fill all</button>
          <button id="bRaw" class="small" title="send a hand-made text frame to test how the server handles bad input">Raw frame…</button>
          <button id="bFormat" class="small">Format</button>
          <button id="bSave" class="small" title="Ctrl+S">★ Save</button>
        </div>
        <div id="bIssues" class="issues hidden"></div>
        <div id="bFieldList" class="fieldlist hidden"></div>
        <textarea id="bBody" spellcheck="false" placeholder="{ }"></textarea>
      </div>
      <div id="splitter" class="splitter" title="drag to resize the body / response split (double-click to reset)"></div>
    </div>

    <div class="bottom">
      <div id="bottomTabs" class="seg left">
        <button data-pane="response">Response</button>
        <button data-pane="timeline">Timeline <span id="tlCount" class="count">0</span></button>
        <button data-pane="state">Player state</button>
      </div>
      <div id="response" class="pane"></div>
      <div id="stateView" class="pane hidden"></div>
      <div id="timeline" class="pane hidden">
        <div class="filters">
          <input id="fText" placeholder="Filter…" spellcheck="false">
          <span id="fSessions" class="fsessions"></span>
          <label class="inline"><input type="checkbox" id="fSys" checked> system</label>
          <label class="inline"><input type="checkbox" id="fCols"> columns</label>
          <label class="inline" title="only messages that break the protocol schema"><input type="checkbox" id="fBad"> schema issues only</label>
          <button id="fClear" class="small">Clear</button>
        </div>
        <div class="log-wrap"><div id="log" class="log"></div><button id="jump" class="primary small hidden">↓ new messages</button></div>
      </div>
    </div>
  </div>
</section>

<section id="view-scenarios" class="view hidden"></section>
<section id="view-settings" class="view hidden"><div class="page"></div></section>

<footer class="statusbar">
  <span class="srv"><span id="lDot" class="dot"></span><b>LOCAL</b> <span id="lText" class="muted">…</span>
    <button id="lStart" class="small">Start</button><button id="lStop" class="small">Stop</button><button id="lLogBtn" class="small ghost">Log</button></span>
  <span class="srv"><span id="dDot" class="dot"></span><b>DEV</b> <span id="dText" class="muted">…</span></span>
  <span class="spacer"></span>
  <span class="credit">Made by <a href="https://github.com/BElluu" target="_blank" rel="noopener">BElluu</a></span>
</footer>
<div id="logDrawer" class="drawer hidden"><div id="drawerHandle" class="drawer-handle" title="drag to resize"></div><pre id="lLog"></pre></div>
<div id="toasts"></div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
